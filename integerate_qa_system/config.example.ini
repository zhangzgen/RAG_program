# Copy this file to config.ini and fill in values for your environment.

[mysql]
host = localhost
user = root
password = 123456
database = subjects_kg

[redis]
host = localhost
port = 6379
password = 1234
db = 0

[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_final

[llm]
model = qwen-plus
api_key = your_openai_compatible_api_key
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
enable_thinking = false
thinking_budget_tokens = 10000

[assessment]
llm_model = qwen-max
embedding_model = text-embedding-v4
api_key = your_assessment_api_key
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
embedding_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 8
candidate_m = 4

[logger]
log_file = logs/app.log

[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678

[email]
qq_email = your_qq_email@qq.com
qq_auth_code = your_qq_email_auth_code
smtp_server = smtp.qq.com
smtp_port = 465

[jwt]
secret_key = change_this_to_a_random_secret
algorithm = HS256
expire_days = 30
